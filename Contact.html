<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Anas NSUNGU</title>

    <link rel="stylesheet" href="Contact.css">
</head>

<body>


    <!-- CONTACT -->
    <main class="contact">

        <section class="contact-container">

            <!-- INFORMATIONS -->
            <div class="contact-info">

                <h1>Contact</h1>

                <p class="contact-intro">
                    N'hésitez pas à me contacter pour toute question
                    ou collaboration.
                </p>


                <div class="contact-details">

                    <div class="contact-detail">
                        <h2>TÉLÉPHONE</h2>
                        <p>+243 826 432 983</p>
                    </div>


                    <div class="contact-detail">
                        <h2>COURRIEL</h2>
                        <p>anaskayembe2703@gmail.com</p>
                    </div>


                    <div class="contact-detail">
                        <h2>RETROUVEZ-MOI</h2>

                        <div class="social-links">

                            <a href="#" aria-label="Instagram">
                                Instagram
                            </a>

                            <a href="#" aria-label="LinkedIn">
                                LinkedIn
                            </a>

                        </div>

                    </div>

                </div>

            </div>


            <!-- FORMULAIRE -->
            <div class="contact-form-container">

                <form class="contact-form">

                    <div class="form-row">

                        <div class="form-group">
                            <label for="nom">Nom</label>

                            <input
                                type="text"
                                id="nom"
                                name="nom"
                                placeholder="Votre nom"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="prenom">Prénom</label>

                            <input
                                type="text"
                                id="prenom"
                                name="prenom"
                                placeholder="Votre prénom"
                                required
                            >
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="email">Courriel ou nom</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Votre email ou téléphone"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="objet">Objet</label>

                            <input
                                type="text"
                                id="objet"
                                name="objet"
                                placeholder="Objet du message"
                                required
                            >
                        </div>

                    </div>


                    <div class="form-group message-group">

                        <label for="message">
                            Suggestions et commentaires
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            placeholder="Écrivez votre message ici..."
                            required
                        ></textarea>

                    </div>


                    <button type="submit">
                        Envoyer
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <p>
            Copyright © 2026 By Anas NSUNGU
        </p>
    </footer>

</body>
</html>
